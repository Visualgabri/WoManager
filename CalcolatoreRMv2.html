<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calcolatore Massimale e RM</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 580px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 10px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Selettore Modalità (Segmented Control) */
        .mode-selector {
            display: flex;
            background: #e2e8f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 0.9em;
            font-weight: 600;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        /* Animazione per apparizione fluida del peso corporeo */
        #bw-group {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.95em;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.05em;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #1e293b;
            font-weight: 500;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: white;
        }

        .formula-selector {
            margin-bottom: 25px;
        }
        
        select {
             cursor: pointer;
             appearance: none;
             background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334495e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
             background-repeat: no-repeat;
             background-position: right 15px center;
             background-size: 16px;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        .calculate-btn:hover, .calculate-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(102, 126, 234, 0.4);
        }

        .results {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .results.show {
            display: block;
        }

        .max-result {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.25);
        }

        .max-result h2 {
            font-size: 1.3em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .max-result .max-value {
            font-size: 2.8em;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            line-height: 1.1;
        }

        .max-subtext {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
            font-weight: 500;
        }

        .rm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .rm-item {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(116, 185, 255, 0.2);
        }

        .rm-label {
            font-size: 0.85em;
            font-weight: 700;
            margin-bottom: 3px;
            opacity: 0.9;
        }

        .rm-value {
            font-size: 1.15em;
            font-weight: 800;
        }

        .rm-assisted {
            font-size: 0.7em;
            display: block;
            opacity: 0.8;
            margin-top: 2px;
        }

        .comparison-results h3 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        #comparisonList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        #comparisonList li {
            background: #f1f5f9;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
        }
        
        #comparisonList .formula-name {
            color: #475569;
            font-weight: 600;
        }
        
        #comparisonList .formula-value {
            color: #0f172a;
            font-weight: 800;
            background: white;
            padding: 4px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .formula-info {
            background: #f0fdf4;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #22c55e;
        }

        .formula-info h3 {
            color: #166534;
            margin-bottom: 6px;
            font-size: 1.1em;
        }

        .formula-info p {
            color: #15803d;
            font-size: 0.9em;
            line-height: 1.4;
        }
        
        #toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            background-color: #334155;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-align: center;
            font-weight: 500;
            font-size: 0.95em;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ottimizzazioni per schermi molto piccoli */
        @media (max-width: 400px) {
            .rm-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .container {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Calcolatore 1RM</h1>

        <!-- Selettore Modalità -->
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-standard" onclick="setMode('standard')">Standard</button>
            <button class="mode-btn" id="btn-pullup" onclick="setMode('pullup')">Trazioni Zavorrate</button>
        </div>
        
        <div class="input-section">
            <div class="input-group" id="bw-group">
                <label for="bodyweight">Peso Corporeo (kg)</label>
                <input type="number" id="bodyweight" step="0.5" min="20" placeholder="Es. 75">
            </div>
            <div class="input-group">
                <label id="weight-label" for="weight">Carico (kg)</label>
                <input type="number" id="weight" step="0.5" min="0" placeholder="Es. 80">
            </div>
            <div class="input-group">
                <label for="reps">Ripetizioni</label>
                <input type="number" id="reps" min="1" max="20" placeholder="Es. 5">
            </div>
        </div>
        
        <div class="formula-selector">
            <label for="formula">Formula di calcolo</label>
            <select id="formula">
                <option value="brzycki">Brzycki (Raccomandata per 2-10 rep)</option>
                <option value="epley">Epley (Generale)</option>
                <option value="lander">Lander</option>
                <option value="lombardi">Lombardi</option>
                <option value="mayhew">Mayhew</option>
                <option value="oconner">O'Conner</option>
                <option value="wathan">Wathan</option>
            </select>
        </div>
        
        <button class="calculate-btn" onclick="calculateRM()">
            Calcola Massimale
        </button>
        
        <div class="results" id="results">
            <div class="max-result">
                <h2 id="max-title">Il tuo 1RM (Massimale)</h2>
                <div class="max-value" id="maxValue">0 kg</div>
                <div class="max-subtext" id="maxSubtext"></div>
            </div>
            
            <div class="rm-grid" id="rmGrid">
                <!-- I risultati RM verranno inseriti qui -->
            </div>
            
            <div class="comparison-results">
                <h3 id="comparison-title">Confronto Formule</h3>
                <ul id="comparisonList">
                    <!-- I risultati del confronto verranno inseriti qui -->
                </ul>
            </div>

            <div class="formula-info">
                <h3 id="formulaTitle"></h3>
                <p id="formulaDescription"></p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        let currentMode = 'standard';

        const formulas = {
            brzycki: (w, r) => w * (36 / (37 - r)),
            epley: (w, r) => w * (1 + r / 30),
            lander: (w, r) => w * (100 / (101.3 - 2.67123 * r)),
            lombardi: (w, r) => w * Math.pow(r, 0.10),
            mayhew: (w, r) => w * (100 / (52.2 + 41.9 * Math.exp(-0.055 * r))),
            oconner: (w, r) => w * (1 + 0.025 * r),
            wathan: (w, r) => w * (100 / (48.8 + 53.8 * Math.exp(-0.075 * r)))
        };

        const formulaDetails = {
            brzycki: { name: 'Brzycki', desc: 'Accurata per 2-10 ripetizioni. Molto usata nel powerlifting e calisthenics.' },
            epley: { name: 'Epley', desc: 'Ottima per un range vario di ripetizioni.' },
            lander: { name: 'Lander', desc: 'Buona per ripetizioni moderate e carichi pesanti.' },
            lombardi: { name: 'Lombardi', desc: 'Formula conservativa, tende a sottostimare leggermente il massimale.' },
            mayhew: { name: 'Mayhew', desc: 'Basata su studi atletici avanzati, molto precisa per alte intensità.' },
            oconner: { name: 'O\'Conner', desc: 'Formula semplice, lineare e conservativa.' },
            wathan: { name: 'Wathan', desc: 'Considerata tra le più precise matematicamente su vari range di ripetizioni.' }
        };

        function setMode(mode) {
            currentMode = mode;
            
            // Aggiorna UI Bottoni
            document.getElementById('btn-standard').classList.remove('active');
            document.getElementById('btn-pullup').classList.remove('active');
            document.getElementById(`btn-${mode}`).classList.add('active');

            // Aggiorna UI Input
            const bwGroup = document.getElementById('bw-group');
            const weightLabel = document.getElementById('weight-label');
            const maxTitle = document.getElementById('max-title');
            const comparisonTitle = document.getElementById('comparison-title');

            if (mode === 'pullup') {
                bwGroup.style.display = 'flex';
                weightLabel.textContent = 'Zavorra Aggiuntiva (kg)';
                maxTitle.textContent = '1RM Zavorra (Max Extra)';
                comparisonTitle.textContent = 'Confronto Formule (Zavorra)';
            } else {
                bwGroup.style.display = 'none';
                weightLabel.textContent = 'Carico (kg)';
                maxTitle.textContent = 'Il tuo 1RM (Massimale)';
                comparisonTitle.textContent = 'Confronto Formule 1RM';
            }

            // Ricalcola se ci sono già dati inseriti
            handleInputChange();
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            
            container.appendChild(toast);
            
            // Trigger reflow per animazione CSS
            void toast.offsetWidth;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
                toast.addEventListener('transitionend', () => toast.remove(), { once: true });
            }, 3000);
        }

        function calculateRM() {
            const weightInput = parseFloat(document.getElementById('weight').value);
            const reps = parseInt(document.getElementById('reps').value);
            const bwInput = parseFloat(document.getElementById('bodyweight').value) || 0;
            const selectedFormulaKey = document.getElementById('formula').value;
            
            if (isNaN(weightInput) || isNaN(reps) || reps <= 0) {
                showToast('Inserisci valori validi per calcolare.');
                return;
            }

            if (currentMode === 'pullup' && (isNaN(bwInput) || bwInput <= 0)) {
                showToast('Inserisci il tuo peso corporeo per le trazioni.');
                return;
            }
            
            if (reps > 20) showToast('Il calcolo è meno preciso oltre le 20 rep.');
            if (reps >= 37 && selectedFormulaKey === 'brzycki') {
                 showToast('Brzycki non è valida per 37+ rep.');
                 return;
            }

            // Calcolo Peso Totale Sollevato
            const totalWeightMoved = currentMode === 'pullup' ? weightInput + bwInput : weightInput;

            // Calcola il 1RM TOTALE con la formula
            const totalOneRM = formulas[selectedFormulaKey](totalWeightMoved, reps);
            
            if (!isFinite(totalOneRM) || totalOneRM < 0) {
                showToast('Errore di calcolo. Controlla i valori.');
                return;
            }

            // Gestione Output Visuale (Massimale)
            const maxValueEl = document.getElementById('maxValue');
            const maxSubtextEl = document.getElementById('maxSubtext');

            if (currentMode === 'pullup') {
                const added1RM = totalOneRM - bwInput;
                const displayMax = added1RM > 0 ? added1RM : 0;
                
                maxValueEl.textContent = `+${displayMax.toFixed(1)} kg`;
                maxSubtextEl.innerHTML = `Peso Totale Spostato: <b>${totalOneRM.toFixed(1)} kg</b>`;
            } else {
                maxValueEl.textContent = `${totalOneRM.toFixed(1)} kg`;
                maxSubtextEl.innerHTML = '';
            }
            
            // Update info formula
            document.getElementById('formulaTitle').textContent = `Formula: ${formulaDetails[selectedFormulaKey].name}`;
            document.getElementById('formulaDescription').innerHTML = formulaDetails[selectedFormulaKey].desc;
            
            // Popola Griglia RM
            const rmGrid = document.getElementById('rmGrid');
            rmGrid.innerHTML = '';
            const percentages = { 2: 0.95, 3: 0.93, 4: 0.90, 5: 0.87, 6: 0.85, 7: 0.83, 8: 0.80, 9: 0.77, 10: 0.75, 11: 0.73, 12: 0.70 };
            
            for (let rm = 2; rm <= 12; rm++) {
                const totalRmWeight = totalOneRM * percentages[rm];
                let displayWeight;
                let isAssisted = false;

                if (currentMode === 'pullup') {
                    displayWeight = totalRmWeight - bwInput;
                    if (displayWeight < 0) {
                        isAssisted = true; // Se il peso calcolato è negativo, serve un elastico
                    }
                } else {
                    displayWeight = totalRmWeight;
                }

                const rmItem = document.createElement('div');
                rmItem.className = 'rm-item';
                
                let weightText = isAssisted 
                    ? `${displayWeight.toFixed(1)} kg <span class="rm-assisted">(Con Elastico)</span>`
                    : `${displayWeight > 0 && currentMode === 'pullup' ? '+' : ''}${displayWeight.toFixed(1)} kg`;

                rmItem.innerHTML = `<div class="rm-label">${rm}RM</div><div class="rm-value">${weightText}</div>`;
                rmGrid.appendChild(rmItem);
            }

            // Popola Lista Confronto
            const comparisonList = document.getElementById('comparisonList');
            comparisonList.innerHTML = '';
            const comparisonResults = [];
            
            for (const key in formulas) {
                let calcTotalRM = formulas[key](totalWeightMoved, reps);
                let finalValue = currentMode === 'pullup' ? calcTotalRM - bwInput : calcTotalRM;
                
                if (isFinite(finalValue)) {
                    comparisonResults.push({ name: formulaDetails[key].name, value: finalValue });
                }
            }
            
            comparisonResults.sort((a, b) => b.value - a.value);
            comparisonResults.forEach(res => {
                const li = document.createElement('li');
                let valText = res.value < 0 ? 'Corpo Libero' : `${res.value > 0 && currentMode === 'pullup' ? '+' : ''}${res.value.toFixed(1)} kg`;
                li.innerHTML = `<span class="formula-name">${res.name}</span><span class="formula-value">${valText}</span>`;
                comparisonList.appendChild(li);
            });
            
            // Mostra i risultati con scorrimento fluido
            const resultsDiv = document.getElementById('results');
            if (!resultsDiv.classList.contains('show')) {
                resultsDiv.classList.add('show');
                setTimeout(() => {
                    resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
            }
        }
        
        // Calcolo automatico mentre si digita
        let calculationTimeout;
        function handleInputChange() {
            clearTimeout(calculationTimeout);
            const weight = document.getElementById('weight').value;
            const reps = document.getElementById('reps').value;
            const bw = document.getElementById('bodyweight').value;
            
            if (weight && reps && (currentMode === 'standard' || bw)) {
                calculationTimeout = setTimeout(calculateRM, 500);
            }
        }

        // Event Listeners
        document.getElementById('weight').addEventListener('input', handleInputChange);
        document.getElementById('reps').addEventListener('input', handleInputChange);
        document.getElementById('bodyweight').addEventListener('input', handleInputChange);
        document.getElementById('formula').addEventListener('change', handleInputChange);
        
        // Evitare il refresh premendo invio
        document.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                calculateRM();
                // Chiudi la tastiera su smartphone
                document.activeElement.blur();
            }
        });

        // Setup iniziale
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('formulaTitle').textContent = `Formula: ${formulaDetails['brzycki'].name}`;
            document.getElementById('formulaDescription').innerHTML = formulaDetails['brzycki'].desc;
            handleInputChange();
        });
    </script>
</body>
</html>
