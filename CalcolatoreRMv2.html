<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calcolatore Massimale e RM</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 580px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 10px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* Selettore Modalità */
        .mode-selector {
            display: flex;
            background: #e2e8f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px 5px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 0.9em;
            font-weight: 600;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        /* Container per opzioni trazioni (BW, Sesso, Età) */
        #pullup-options {
            display: none;
            grid-column: 1 / -1; /* Occupa tutta la larghezza */
            background: rgba(102, 126, 234, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
            animation: fadeIn 0.4s ease;
        }

        .pullup-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 0.9em;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #1e293b;
            font-weight: 500;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: white;
        }

        select {
             cursor: pointer;
             appearance: none;
             background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334495e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
             background-repeat: no-repeat;
             background-position: right 10px center;
             background-size: 14px;
        }

        .formula-selector { margin-bottom: 25px; }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.3);
        }

        .calculate-btn:hover, .calculate-btn:active {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(102, 126, 234, 0.4);
        }

        .results {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .results.show { display: block; }

        .primary-results-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        .max-result {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.25);
        }

        .bw-reps-result {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
            display: none;
        }

        .max-result h2, .bw-reps-result h3 {
            font-size: 1.1em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .max-result .max-value {
            font-size: 2.8em;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            line-height: 1.1;
        }

        .bw-reps-result .bw-reps-value {
            font-size: 2.2em;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .max-subtext {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
            font-weight: 500;
        }

        /* Stile per il livello di forza */
        .strength-level {
            display: none;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: white;
            font-weight: 700;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: fadeIn 0.4s ease;
        }
        .strength-level.show { display: block; }
        .lvl-principiante { background: #94a3b8; }
        .lvl-novizio { background: #2ecc71; }
        .lvl-intermedio { background: #3498db; }
        .lvl-avanzato { background: #9b59b6; }
        .lvl-elite { background: #f1c40f; color: #786004; }

        .rm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }

        .rm-item {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(116, 185, 255, 0.2);
        }

        .rm-label { font-size: 0.85em; font-weight: 700; margin-bottom: 3px; opacity: 0.9; }
        .rm-value { font-size: 1.15em; font-weight: 800; }
        .rm-assisted { font-size: 0.7em; display: block; opacity: 0.8; margin-top: 2px; }

        .comparison-results h3 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        #comparisonList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        #comparisonList li {
            background: #f1f5f9;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
        }
        
        #comparisonList .formula-name { color: #475569; font-weight: 600; }
        #comparisonList .formula-value {
            color: #0f172a;
            font-weight: 800;
            background: white;
            padding: 4px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .formula-info {
            background: #f0fdf4;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #22c55e;
        }
        .formula-info h3 { color: #166534; margin-bottom: 6px; font-size: 1.1em; }
        .formula-info p { color: #15803d; font-size: 0.9em; line-height: 1.4; }
        
        #toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            background-color: #334155;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            text-align: center;
            font-weight: 500;
            font-size: 0.95em;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 450px) {
            .pullup-grid { grid-template-columns: 1fr; }
            .rm-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 25px 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Calcolatore 1RM</h1>

        <!-- Selettore Modalità -->
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-standard" onclick="setMode('standard')">Standard</button>
            <button class="mode-btn" id="btn-pullup" onclick="setMode('pullup')">Trazioni</button>
        </div>
        
        <div class="input-section">
            
            <!-- Pannello Trazioni (BW, Sesso, Età) -->
            <div id="pullup-options">
                <div class="pullup-grid">
                    <div class="input-group">
                        <label for="bodyweight">Peso (kg)*</label>
                        <input type="number" id="bodyweight" step="0.5" min="20" placeholder="Es. 75">
                    </div>
                    <div class="input-group">
                        <label for="gender">Sesso (Opz.)</label>
                        <select id="gender">
                            <option value="">Nessuno</option>
                            <option value="male">Uomo</option>
                            <option value="female">Donna</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="age">Età (Opz.)</label>
                        <input type="number" id="age" min="10" max="100" placeholder="Anni">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label id="weight-label" for="weight">Carico (kg)</label>
                <input type="number" id="weight" step="0.5" min="0" placeholder="Es. 80">
            </div>
            <div class="input-group">
                <label for="reps">Ripetizioni</label>
                <input type="number" id="reps" min="1" max="20" placeholder="Es. 5">
            </div>
        </div>
        
        <div class="formula-selector">
            <label for="formula">Formula di calcolo</label>
            <select id="formula">
                <option value="brzycki">Brzycki (Raccomandata per 2-10 rep)</option>
                <option value="epley">Epley (Generale)</option>
                <option value="lander">Lander</option>
                <option value="lombardi">Lombardi</option>
                <option value="mayhew">Mayhew</option>
                <option value="oconner">O'Conner</option>
                <option value="wathan">Wathan</option>
            </select>
        </div>
        
        <button class="calculate-btn" onclick="calculateRM()">
            Calcola Massimale
        </button>
        
        <div class="results" id="results">
            
            <div class="primary-results-grid">
                <div class="max-result">
                    <h2 id="max-title">Il tuo 1RM (Massimale)</h2>
                    <div class="max-value" id="maxValue">0 kg</div>
                    <div class="max-subtext" id="maxSubtext"></div>
                </div>
                
                <!-- Riquadro reps a corpo libero -->
                <div class="bw-reps-result" id="bwRepsContainer">
                    <h3>Stima Reps a Vuoto</h3>
                    <div class="bw-reps-value" id="bwRepsValue">0</div>
                    <div class="max-subtext">Corpo libero</div>
                </div>
            </div>

            <!-- Riquadro Livello di Forza -->
            <div id="strengthLevel" class="strength-level">
                Livello: <span id="strengthText"></span>
            </div>
            
            <div class="rm-grid" id="rmGrid">
                <!-- I risultati RM verranno inseriti qui -->
            </div>
            
            <div class="comparison-results">
                <h3 id="comparison-title">Confronto Formule</h3>
                <ul id="comparisonList">
                    <!-- I risultati del confronto verranno inseriti qui -->
                </ul>
            </div>

            <div class="formula-info">
                <h3 id="formulaTitle"></h3>
                <p id="formulaDescription"></p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        let currentMode = 'standard';

        const formulas = {
            brzycki: (w, r) => w * (36 / (37 - r)),
            epley: (w, r) => w * (1 + r / 30),
            lander: (w, r) => w * (100 / (101.3 - 2.67123 * r)),
            lombardi: (w, r) => w * Math.pow(r, 0.10),
            mayhew: (w, r) => w * (100 / (52.2 + 41.9 * Math.exp(-0.055 * r))),
            oconner: (w, r) => w * (1 + 0.025 * r),
            wathan: (w, r) => w * (100 / (48.8 + 53.8 * Math.exp(-0.075 * r)))
        };

        const reverseFormulas = {
            brzycki: (M, W) => 37 - (36 * W / M),
            epley: (M, W) => 30 * ((M / W) - 1),
            lander: (M, W) => (101.3 - (100 * W / M)) / 2.67123,
            lombardi: (M, W) => Math.pow(M / W, 10),
            mayhew: (M, W) => { const val = ((100 * W / M) - 52.2) / 41.9; return val > 0 ? Math.log(val) / -0.055 : null; },
            oconner: (M, W) => ((M / W) - 1) / 0.025,
            wathan: (M, W) => { const val = ((100 * W / M) - 48.8) / 53.8; return val > 0 ? Math.log(val) / -0.075 : null; }
        };

        const formulaDetails = {
            brzycki: { name: 'Brzycki', desc: 'Accurata per 2-10 ripetizioni. Molto usata.' },
            epley: { name: 'Epley', desc: 'Ottima per un range vario di ripetizioni.' },
            lander: { name: 'Lander', desc: 'Buona per ripetizioni moderate e carichi pesanti.' },
            lombardi: { name: 'Lombardi', desc: 'Conservativa, tende a sottostimare leggermente.' },
            mayhew: { name: 'Mayhew', desc: 'Molto precisa per alte intensità e atleti esperti.' },
            oconner: { name: 'O\'Conner', desc: 'Formula semplice, lineare e conservativa.' },
            wathan: { name: 'Wathan', desc: 'Matematicamente precisa su vari range di ripetizioni.' }
        };

        function setMode(mode) {
            currentMode = mode;
            
            document.getElementById('btn-standard').classList.remove('active');
            document.getElementById('btn-pullup').classList.remove('active');
            document.getElementById(`btn-${mode}`).classList.add('active');

            const pullupOptions = document.getElementById('pullup-options');
            const weightLabel = document.getElementById('weight-label');
            const maxTitle = document.getElementById('max-title');
            const comparisonTitle = document.getElementById('comparison-title');
            const bwRepsContainer = document.getElementById('bwRepsContainer');
            const strengthLvl = document.getElementById('strengthLevel');

            if (mode === 'pullup') {
                pullupOptions.style.display = 'block';
                weightLabel.textContent = 'Zavorra (kg)';
                maxTitle.textContent = '1RM Zavorra (Max Extra)';
                comparisonTitle.textContent = 'Confronto Formule (Zavorra)';
            } else {
                pullupOptions.style.display = 'none';
                weightLabel.textContent = 'Carico (kg)';
                maxTitle.textContent = 'Il tuo 1RM (Massimale)';
                comparisonTitle.textContent = 'Confronto Formule 1RM';
                bwRepsContainer.style.display = 'none';
                strengthLvl.classList.remove('show');
            }

            handleInputChange();
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            void toast.offsetWidth;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                toast.addEventListener('transitionend', () => toast.remove(), { once: true });
            }, 3000);
        }

        // Funzione per valutare il livello di forza
        function evalStrength(total1RM, bw, gender, ageStr) {
            if (!gender) return null; // Se non c'è il sesso, niente valutazione
            
            const ratio = total1RM / bw;
            const age = parseInt(ageStr) || 25; // Default 25 anni se non inserita

            // Modificatore Età (declino fisiologico)
            let ageMod = 1.0;
            if (age >= 40 && age < 50) ageMod = 0.93;
            else if (age >= 50 && age < 60) ageMod = 0.85;
            else if (age >= 60) ageMod = 0.75;

            // Rapporti Standard (Total Weight / Bodyweight) per Uomo e Donna
            // Soglie: [Novizio, Intermedio, Avanzato, Elite]
            const standards = {
                male: [1.10, 1.40, 1.70, 2.00],
                female: [0.95, 1.20, 1.45, 1.70]
            };

            const thresholds = standards[gender].map(val => val * ageMod);

            if (ratio < thresholds[0]) return { text: "Principiante", class: "lvl-principiante" };
            if (ratio < thresholds[1]) return { text: "Novizio", class: "lvl-novizio" };
            if (ratio < thresholds[2]) return { text: "Intermedio", class: "lvl-intermedio" };
            if (ratio < thresholds[3]) return { text: "Avanzato", class: "lvl-avanzato" };
            return { text: "Elite", class: "lvl-elite" };
        }

        function calculateRM() {
            const weightInput = parseFloat(document.getElementById('weight').value);
            const reps = parseInt(document.getElementById('reps').value);
            const bwInput = parseFloat(document.getElementById('bodyweight').value) || 0;
            const genderInput = document.getElementById('gender').value;
            const ageInput = document.getElementById('age').value;
            const selectedFormulaKey = document.getElementById('formula').value;
            
            if (isNaN(weightInput) || isNaN(reps) || reps <= 0) {
                showToast('Inserisci valori validi per calcolare.');
                return;
            }

            if (currentMode === 'pullup' && (isNaN(bwInput) || bwInput <= 0)) {
                showToast('Inserisci il tuo peso corporeo obbligatorio.');
                return;
            }
            
            if (reps >= 37 && selectedFormulaKey === 'brzycki') {
                 showToast('Brzycki non è valida per 37+ rep.');
                 return;
            }

            // Calcolo base
            const totalWeightMoved = currentMode === 'pullup' ? weightInput + bwInput : weightInput;
            const totalOneRM = formulas[selectedFormulaKey](totalWeightMoved, reps);
            
            if (!isFinite(totalOneRM) || totalOneRM < 0) {
                showToast('Errore di calcolo. Controlla i valori.');
                return;
            }

            const maxValueEl = document.getElementById('maxValue');
            const maxSubtextEl = document.getElementById('maxSubtext');
            const bwRepsContainer = document.getElementById('bwRepsContainer');
            const bwRepsValueEl = document.getElementById('bwRepsValue');
            const strengthLvl = document.getElementById('strengthLevel');

            if (currentMode === 'pullup') {
                const added1RM = totalOneRM - bwInput;
                const displayMax = added1RM > 0 ? added1RM : 0;
                
                maxValueEl.textContent = `+${displayMax.toFixed(1)} kg`;
                maxSubtextEl.innerHTML = `Peso Totale Spostato: <b>${totalOneRM.toFixed(1)} kg</b>`;
                
                // REPS A CORPO LIBERO
                let estReps = reverseFormulas[selectedFormulaKey](totalOneRM, bwInput);
                if (estReps === null || isNaN(estReps)) {
                    estReps = reverseFormulas['epley'](totalOneRM, bwInput); 
                }
                estReps = Math.max(0, Math.round(estReps));
                bwRepsValueEl.textContent = `~ ${estReps}`;
                bwRepsContainer.style.display = 'block';

                // LIVELLO DI FORZA
                const levelData = evalStrength(totalOneRM, bwInput, genderInput, ageInput);
                if (levelData) {
                    strengthLvl.className = `strength-level show ${levelData.class}`;
                    document.getElementById('strengthText').textContent = levelData.text;
                } else {
                    strengthLvl.classList.remove('show');
                }

            } else {
                maxValueEl.textContent = `${totalOneRM.toFixed(1)} kg`;
                maxSubtextEl.innerHTML = '';
                bwRepsContainer.style.display = 'none';
                strengthLvl.classList.remove('show');
            }
            
            document.getElementById('formulaTitle').textContent = `Formula: ${formulaDetails[selectedFormulaKey].name}`;
            document.getElementById('formulaDescription').innerHTML = formulaDetails[selectedFormulaKey].desc;
            
            // Griglia RM
            const rmGrid = document.getElementById('rmGrid');
            rmGrid.innerHTML = '';
            const percentages = { 2: 0.95, 3: 0.93, 4: 0.90, 5: 0.87, 6: 0.85, 7: 0.83, 8: 0.80, 9: 0.77, 10: 0.75, 11: 0.73, 12: 0.70 };
            
            for (let rm = 2; rm <= 12; rm++) {
                const totalRmWeight = totalOneRM * percentages[rm];
                let displayWeight;
                let isAssisted = false;

                if (currentMode === 'pullup') {
                    displayWeight = totalRmWeight - bwInput;
                    if (displayWeight < 0) isAssisted = true;
                } else {
                    displayWeight = totalRmWeight;
                }

                const rmItem = document.createElement('div');
                rmItem.className = 'rm-item';
                let weightText = isAssisted 
                    ? `${displayWeight.toFixed(1)} kg <span class="rm-assisted">(Con Elastico)</span>`
                    : `${displayWeight > 0 && currentMode === 'pullup' ? '+' : ''}${displayWeight.toFixed(1)} kg`;

                rmItem.innerHTML = `<div class="rm-label">${rm}RM</div><div class="rm-value">${weightText}</div>`;
                rmGrid.appendChild(rmItem);
            }

            // Confronto Formule
            const comparisonList = document.getElementById('comparisonList');
            comparisonList.innerHTML = '';
            const comparisonResults = [];
            
            for (const key in formulas) {
                let calcTotalRM = formulas[key](totalWeightMoved, reps);
                let finalValue = currentMode === 'pullup' ? calcTotalRM - bwInput : calcTotalRM;
                if (isFinite(finalValue)) {
                    comparisonResults.push({ name: formulaDetails[key].name, value: finalValue });
                }
            }
            
            comparisonResults.sort((a, b) => b.value - a.value);
            comparisonResults.forEach(res => {
                const li = document.createElement('li');
                let valText = res.value < 0 ? 'Corpo Libero' : `${res.value > 0 && currentMode === 'pullup' ? '+' : ''}${res.value.toFixed(1)} kg`;
                li.innerHTML = `<span class="formula-name">${res.name}</span><span class="formula-value">${valText}</span>`;
                comparisonList.appendChild(li);
            });
            
            const resultsDiv = document.getElementById('results');
            if (!resultsDiv.classList.contains('show')) {
                resultsDiv.classList.add('show');
                setTimeout(() => { resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            }
        }
        
        let calculationTimeout;
        function handleInputChange() {
            clearTimeout(calculationTimeout);
            const weight = document.getElementById('weight').value;
            const reps = document.getElementById('reps').value;
            const bw = document.getElementById('bodyweight').value;
            
            if (weight && reps && (currentMode === 'standard' || bw)) {
                calculationTimeout = setTimeout(calculateRM, 500);
            }
        }

        document.getElementById('weight').addEventListener('input', handleInputChange);
        document.getElementById('reps').addEventListener('input', handleInputChange);
        document.getElementById('bodyweight').addEventListener('input', handleInputChange);
        document.getElementById('gender').addEventListener('change', handleInputChange);
        document.getElementById('age').addEventListener('input', handleInputChange);
        document.getElementById('formula').addEventListener('change', handleInputChange);
        
        document.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                calculateRM();
                document.activeElement.blur();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('formulaTitle').textContent = `Formula: ${formulaDetails['brzycki'].name}`;
            document.getElementById('formulaDescription').innerHTML = formulaDetails['brzycki'].desc;
            handleInputChange();
        });
    </script>
</body>
</html>
